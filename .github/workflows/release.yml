name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import re

          source = pathlib.Path('build.zig.zon').read_text()
          version = re.search(r'\.version\s*=\s*"([^"]+)"', source).group(1)
          tag = os.environ['RELEASE_TAG']
          if tag != f'v{version}':
              raise SystemExit(f'Tag {tag!r} must match package version v{version}')
          PY

  linux:
    needs: version
    uses: ./.github/workflows/linux.yml

  publish:
    needs: linux
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: kiwa-*
          merge-multiple: true
          path: dist
      - name: Create release with checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd dist
          test -f kiwa-x86_64-linux-musl.tar.gz
          test -f kiwa-aarch64-linux-musl.tar.gz
          sha256sum ./*.tar.gz > SHA256SUMS
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" ./*.tar.gz SHA256SUMS \
            --verify-tag --generate-notes --title "$RELEASE_TAG" "${flags[@]}"
