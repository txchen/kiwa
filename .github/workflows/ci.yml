name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      full_randomized:
        description: Run the full randomized budget on every target and build mode
        type: boolean
        default: false
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    uses: ./.github/workflows/linux.yml
    with:
      full_randomized: ${{ github.event_name == 'schedule' || inputs.full_randomized == true }}
  macos:
    uses: ./.github/workflows/macos.yml
    with:
      full_randomized: ${{ github.event_name == 'schedule' || inputs.full_randomized == true }}
