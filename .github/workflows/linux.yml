name: Linux builds

on:
  workflow_call:
    inputs:
      full_randomized:
        description: Run the full randomized budget on every target and build mode
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.platform.target }} / ${{ matrix.optimize }}
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 30
    env:
      FUZZ_PERCENT: ${{ (inputs.full_randomized || matrix.optimize == 'Debug') && 100 || 10 }}
    strategy:
      fail-fast: false
      matrix:
        optimize: [Debug, ReleaseFast]
        platform:
          - runner: ubuntu-24.04
            target: x86_64-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-linux-musl
        # Debug runs safety checks, which do not depend on the CPU, so one
        # architecture is enough. Every shipped binary is tested ReleaseFast.
        exclude:
          - optimize: Debug
            platform:
              runner: ubuntu-24.04-arm
              target: aarch64-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
      # Zig unpacks dependencies into zig-pkg/. Restoring it skips the
      # download, so a flaky upstream host cannot fail the build.
      - name: Cache Zig packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: zig-pkg
          key: zig-pkg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build.zig.zon') }}
      - name: Install end-to-end test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends git python3 less vim htop fzf ncurses-bin ncurses-term
      - name: Check formatting
        if: matrix.optimize == 'Debug'
        run: mise exec -- zig fmt --check build.zig build.zig.zon src tests
      - name: Check that only src/os and tests/os use OS-specific APIs
        if: matrix.optimize == 'Debug'
        run: tools/check-os-layer.sh
      - name: Build and run unit and end-to-end tests
        run: >-
          mise exec -- zig build test e2e
          -Dtarget=${{ matrix.platform.target }}
          -Dcpu=baseline -Doptimize=${{ matrix.optimize }} -Dfuzz="$FUZZ_PERCENT"
      - name: Build release binary
        if: matrix.optimize == 'ReleaseFast'
        run: >-
          mise exec -- zig build
          -Dtarget=${{ matrix.platform.target }}
          -Dcpu=baseline -Doptimize=ReleaseFast -Dfuzz="$FUZZ_PERCENT"
      - name: Package release binary
        if: matrix.optimize == 'ReleaseFast'
        env:
          TARGET: ${{ matrix.platform.target }}
        run: |
          zig-out/bin/kiwa --version
          mkdir -p dist
          tar -czf "dist/kiwa-$TARGET.tar.gz" -C zig-out/bin kiwa
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.optimize == 'ReleaseFast'
        with:
          name: kiwa-${{ matrix.platform.target }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7
